<!DOCTYPE html>
<html lang="ru">
<head>
  <meta charset="UTF-8">
  <title>🎬 Мой YouTube (Firebase)</title>
  <style>
    body {
      font-family: sans-serif;
      max-width: 800px;
      margin: auto;
      padding: 20px;
    }
    video {
      max-width: 100%;
      margin-bottom: 20px;
      border: 1px solid #ccc;
    }
    button {
      margin-top: 10px;
      padding: 10px 20px;
      font-size: 16px;
    }
    #progress-container {
      margin-top: 10px;
      width: 100%;
      background: #eee;
      height: 20px;
      border-radius: 10px;
      overflow: hidden;
      display: none;
    }
    #progress-bar {
      height: 100%;
      background: #4caf50;
      width: 0%;
    }
  </style>
</head>
<body>
  <h1>🎥 Мой YouTube (Firebase)</h1>

  <input type="file" id="fileInput" accept="video/*">
  <button onclick="uploadVideo()">📤 Загрузить видео</button>

  <div id="progress-container">
    <div id="progress-bar"></div>
  </div>
  <p id="progress-text"></p>

  <hr>
  <h2>🌐 Все загруженные видео:</h2>
  <div id="videos">Загрузка...</div>

  <script type="module" src="firebase.js"></script>
</body>
</html>
